name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by publish.yml so a release is held to exactly these gates rather than to a copy of
  # them that is free to drift. Only the calling workflow may publish — see the note there.
  workflow_call:

# A push that has already been replaced has nothing left to say. Tags are unaffected: the group is
# keyed on the ref and a tag ref is pushed once, so no release run can be cancelled by a later one.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # Which versions pass is the question this matrix exists to answer, so a red one must not
      # take the others down with it and hide the answer.
      fail-fast: false
      matrix:
        node:
          # The exact floor `engines` promises. Testing it is the point: we advertise 22.18 and
          # would otherwise never run a line of this on it.
          - "22.18.0"
          # The latest of that LTS line, which is what someone on "Node 22" actually has.
          - "22"
          # What publish.yml releases from, and the only line here whose bundled npm is new enough
          # for trusted publishing — 22 ships npm 10.9.x, under the 11.5.1 floor.
          - "24"
          #
          # 23 is deliberately absent, though `engines` admits it: type stripping stayed behind a
          # flag until 23.6, so `node --test` on a .ts file fails outright before 23.6 with
          # ERR_UNKNOWN_FILE_EXTENSION. The line has been end-of-life since 2025 and nobody should
          # be on it; the alternative is raising `engines` past a Node 22 LTS that works fine.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run check

      # `pretest` builds too, so this cannot be what makes the tests work — it is here because the
      # build is a gate of its own, and running it under its own name means a broken bundle reports
      # itself as a broken bundle instead of as a failed assertion inside packaging.test.ts.
      - run: npm run build

      # Needs no Weeek token and reaches no network: the HTTP client takes its fetch by injection
      # and every test supplies a stub, and secrets.test.ts asserts up front that this platform
      # cannot reach a keychain before it writes anything. Verified on a bare Linux container with
      # no WEEEK_* variable set at all.
      - run: npm test
